name: Daily geography news

on:
  schedule:
    - cron: '30 8 * * 1-5'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-geography-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and select news
        run: node scripts/update.mjs
      - name: Check that stories were found
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const date = new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/London' });
          const news = JSON.parse(fs.readFileSync(`data/news/${date}.json`, 'utf8'));
          if (!Array.isArray(news.stories) || news.stories.length === 0) {
            console.error('No stories selected; keeping the previous news instead.');
            process.exit(1);
          }
          NODE
      - name: Commit news
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news
          if git diff --cached --quiet; then
            echo 'No news changes to commit.'
            exit 0
          fi
          git commit -m 'Update geography news'
          git push
